name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: triage
          POSTGRES_PASSWORD: triage
          POSTGRES_DB: triage_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U triage" --health-interval 3s --health-timeout 3s --health-retries 20
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - name: Tests (mocked APIs, scripted LLM, real Postgres)
        run: pytest -q
        env:
          TEST_DATABASE_URL: postgresql://triage:triage@localhost:5432/triage_test
      - name: Eval smoke test (rules baseline, no API key needed)
        run: python -m evals.run_evals --engine baseline
        env:
          EMBEDDING_BACKEND: tfidf
          DATABASE_URL: sqlite:///ci.db

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
